name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要构建并发布的 tag，例如 v0.4.0"
        required: true
      ref:
        description: "可选：构建哪个 ref，留空则使用上面的 tag"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows x64 + ia32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip

  macos:
    name: macOS Intel + Apple Silicon
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  release:
    name: Publish release and site
    needs: [windows, macos]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prepare release metadata
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          NOTES="docs/release-notes-${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            printf '# Flash Gamer %s\n\n- 本版本由 GitHub Actions 自动构建。\n' "$TAG" > "$NOTES"
          fi
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
          node scripts/make-update-manifests.js \
            --dir artifacts \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --out site/updates \
            --notes-file "$NOTES" \
            --require-all
          mkdir -p _site
          cp site/index.html _site/
          cp -R site/assets _site/assets
          cp -R site/updates _site/updates
      - uses: actions/upload-artifact@v4
        with:
          name: update-manifests
          path: site/updates/*.json
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Flash Gamer $TAG" --notes-file "$NOTES" --verify-tag
          fi
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            for attempt in 1 2 3 4; do
              if gh release upload "$TAG" "$f" --clobber; then
                break
              fi
              if [ "$attempt" = 4 ]; then
                echo "上传失败：$(basename "$f")"
                exit 1
              fi
              sleep 10
            done
          done
          gh release edit "$TAG" --title "Flash Gamer $TAG" --notes-file "$NOTES" --latest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
