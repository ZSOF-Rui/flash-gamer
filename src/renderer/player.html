<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Flash Gamer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0f; overflow: hidden; }
    #stage { position: absolute; inset: 0; }
    ruffle-player { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script id="boot" type="application/json">__BOOT__</script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    var __apDebugLog = false;
    try { __apDebugLog = localStorage.getItem('apDebug') === '1'; } catch (e) {}
    window.RufflePlayer.config = {
      publicPath: '/vendor/ruffle/',
      autoplay: 'on',
      unmuteOverlay: 'visible',
      letterbox: 'on',
      scale: 'showAll',
      quality: 'high',
      warnOnUnsupportedContent: false,
      logLevel: __apDebugLog ? 'info' : 'error',
      openUrlMode: 'deny',
      allowNetworking: 'all',
      allowScriptAccess: true,
      upgradeToHttps: false,
      allowFullscreen: true,
      contextMenu: 'on',
      backgroundColor: '#000000',
      preloader: true,
      splashScreen: false
    };
  </script>
  <script src="/vendor/ruffle/ruffle.js"></script>
  <script>
    window.__apErrors = [];
    window.addEventListener('error', function (e) { window.__apErrors.push(String(e.message || e)); });
    if (__apDebugLog) {
      (function () {
        var rg = Reflect.get;
        Reflect.get = function (t, k, r) {
          try { if (t === window && typeof k === 'string' && /^(4399|ap_|calljs|jsCall)/i.test(k)) console.log('[EIGET]', k); } catch (e) {}
          return rg.apply(this, arguments);
        };
      })();
    }
    window.addEventListener('unhandledrejection', function (e) { window.__apErrors.push('reject: ' + String(e.reason)); });
    // 4399 外壳会通过 ExternalInterface 调 setTimeout 克隆并替换 <object>/<embed> 来"修正"参数；
    // Ruffle 的 <ruffle-player> 被克隆后不会再初始化，这里拦截该重载脚本。
    (function () {
      var nativeTimeout = window.setTimeout;
      window.setTimeout = function (fn, ms) {
        if (typeof fn === 'string' && fn.indexOf('fl_obj') !== -1 && fn.indexOf('cloneNode') !== -1) {
          console.warn('[FlashGamer] blocked 4399 player reload');
          return 0;
        }
        return nativeTimeout.apply(this, arguments);
      };
    })();
    (function () {
      var boot = JSON.parse(document.getElementById('boot').textContent);
      if (boot.title) document.title = boot.title + ' — Flash Gamer';
      var post = function (m) {
        try { parent.postMessage(Object.assign({ __ap: 1 }, m), '*'); } catch (e) {}
      };
      try {
        var ruffle = window.RufflePlayer.newest();
        var player = ruffle.createPlayer();
        player.id = 'flashgame';
        player.setAttribute('name', 'flashgame');
        player.setAttribute('type', 'application/x-shockwave-flash');
        player.setAttribute('allowScriptAccess', 'always');
        player.setAttribute('allowNetworking', 'all');
        player.setAttribute('allowFullScreen', 'true');
        // 4399 壳通过 ExternalInterface 找到播放器元素后，按 nodeName 区分 OBJECT/EMBED，
        // 再用 getAttribute 读取 allowScriptAccess/allowNetworking 与期望值比对；不匹配就
        // dispose 并克隆替换元素。把 <ruffle-player> 伪装成 EMBED 并补齐这些属性；id/name
        // 用于让 ExternalInterface.objectID 找到元素（壳还会校验回调属性是否存在）。
        try {
          Object.defineProperty(player, 'nodeName', { get: function () { return 'EMBED'; }, configurable: true });
          Object.defineProperty(player, 'tagName', { get: function () { return 'EMBED'; }, configurable: true });
        } catch (e) {}
        player.style.width = '100%';
        player.style.height = '100%';
        document.getElementById('stage').appendChild(player);

        player.addEventListener('loadedmetadata', function () {
          var md = player.metadata || {};
          post({
            type: 'meta',
            meta: {
              width: md.width, height: md.height,
              frameRate: md.frameRate, swfVersion: md.swfVersion,
              numFrames: md.numFrames
            }
          });
        });
        player.addEventListener('error', function (e) {
          post({ type: 'error', message: String((e && e.message) || e) });
        });
        player.addEventListener('fscommand', function (e) {
          post({ type: 'fscommand', command: e.command, args: e.args });
        });

        player.load({
          url: boot.swfUrl,
          base: boot.baseUrl,
          parameters: boot.parameters || {},
          allowScriptAccess: true,
          autoplay: 'on',
          unmuteOverlay: 'visible'
        });
        post({ type: 'ready' });
      } catch (e) {
        post({ type: 'error', message: String(e) });
      }
    })();
  </script>
</body>
</html>
